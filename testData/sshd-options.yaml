  help: >-
    default: The nighttime cloud color will be unchanged. blue: The nighttime cloud color will be a
    pastel blue color. green: The nighttime cloud color will be a pastel green color. yellow: The
    nighttime cloud color will be a pastel yellow color. orange: The nighttime cloud color will be a
    pastel orange color. red: The nighttime cloud color will be a pastel red color. purple: The
    nighttime cloud color will be a pastel purple color. pink: The nighttime cloud color will be a
    pastel pink color. white: The nighttime cloud color will be a white color. black: The nighttime
    cloud color will be a black color. grey: The nighttime cloud color will be a grey color.
    rainbow: The nighttime cloud color will fade between different colors over time.
- name: Randomize Music
  command: randomize-music
  type: singlechoice
  choices:
    - vanilla
    - shuffle_music
    - shuffle_music_limit_vanilla
  default: vanilla
  bits: 2
  help: >-
    vanilla: The background music will not be shuffled. shuffle_music: The background music will be
    randomly shuffled. shuffle_music_limit_vanilla: The background music will be shuffled to
    minimize the number of unchanged tracks.
- name: Cutoff Game Over Music
  command: cutoff-game-over-music
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: The game over music will continue to play until the song has ended, even if the Randomize
    Music setting places a very long song as the game over sound. on: The game over music will be
    cutoff when selecting continue after dying.
- name: Remove Enemy Music
  command: remove-enemy-music
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: The background music will be interrupted by enemy drums when you get near to an enemy.
    Additionally, the intense music when Scaldera and Tentalus are vulnerable will play as normal.
    on: The background music will continue to play when you get near to enemies. Additionally, the
    intense music when Scaldera and Tentalus are vulnerable will not play and the background music
    will continue uninterrupted.
- name: Text Shuffle
  command: text-shuffle
  type: singlechoice
  choices:
    - 'off'
    - baby
    - crazy
    - extreme
    - european_extreme
    - psychopath
  default: 'off'
  bits: 3
  help: >-
    off: All in-game text will be unchanged. baby: English text will be shuffled, but shop text and
    other important functional text will be left intact. crazy: All English text will be shuffled.
    Text will be shuffled in sentences and paragraphs to maintain some readability. extreme: All
    English text will be fully shuffled. european_extreme: Text from all Latin-script languages
    (English, French, Spanish, German, Italian, Dutch) will be shuffled. Text will be shuffled in
    sentences and paragraphs to maintain some readability. psychopath: Text from all Latin-script
    languages (English, French, Spanish, German, Italian, Dutch) will be fully shuffled.
- name: Low Health Beeping Speed
  command: low-health-beeping-speed
  type: singlechoice
  choices:
    - very_fast
    - fast
    - normal
    - slow
    - very_slow
    - no_beeping
    - no_beeping_or_flashing
  default: normal
  bits: 3
  help: >-
    very_fast: The game will play the low health beep sound every time Link flashes red. fast: The
    game will play the low health beep sound every other time Link flashes red. normal: The game
    will play the low health beep sound every 3rd time Link flashes red. slow: The game will play
    the low health beep sound every 6th time Link flashes red. very_slow: The game will play the low
    health beep sound every 12th time Link flashes red. no_beeping: The game will not play the low
    health beep sound. Link will still flash red. no_beeping_or_flashing: The game will not play the
    low health beep sound. Link will not flash red either.
- name: Open Earth Temple
  command: open-earth-temple
  type: singlechoice
  choices:
    - open
    - shuffle_eldin
    - shuffle_anywhere
  default: open
  bits: 2
  help: >-
    open: The Earth Temple Door will be opened from the start of the game. shuffle_eldin: You will
    need to collect all the Earth Temple Key Pieces, shuffled within the Eldin Volcano region
    (including Mogma Turf if overworld entrances are not randomized), in order to open the Earth
    Temple Door. shuffle_anywhere: You will need to collect all the Earth Temple Key Pieces,
    shuffled anywhere, in order to open the Earth Temple Door.
