- name: Skyview Temple Precise Slingshot
  command: logic-skyview-precise-slingshot
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to get the Skyview Temple - Item behind Bars by either using the
    Beetle to hit the crystal or by using the Whip. on: You may need to use the Slingshot to
    precisely hit the crystal at the top of the second hub room to get the Skyview Temple - Item
    behind Bars.
- name: Earth Temple Keese Skyward Strike
  command: logic-et-keese-skyward-strike
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to break the high rope on the first Earth Temple bridge using a
    Beetle or the Bow. on: You may need to precisely manipulate a specific Keese's position and use
    a long range Skyward Strike to break the high rope on the first bridge in Earth Temple.
- name: Earth Temple Slope Stuttersprint
  command: logic-et-slope-stuttersprint
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to get to the top of the second Earth Temple slope by opening the
    blocked cubby part-way up the slope so you can recover stamina. on: You may need to manipulate
    the boulders to fall on the second Earth Temple slope so that you can stuttersprint to the top
    without getting hit.
- name: Earth Temple Bomb Flower Scaldera
  command: logic-et-bombless-scaldera
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to defeat Scaldera using the Bomb Bag and a Sword. on: You may
    need to defeat Scaldera using only the bomb flowers at the top of the boss arena and the fully
    upgraded Skyward Strike.
- name: Lanayru Mining Facility Whip Switch
  command: logic-lmf-whip-switch
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to flip the left lever in the first room of Lanayru Mining
    Facility by using the Hook Beetle to knock down the statue platform. on: You may need to run
    into the quicksand and use the Whip to flip the left lever in the first room of Lanayru Mining
    Facility.
- name: Lanayru Mining Facility Precise Slingshot
  command: logic-lmf-ceiling-precise-slingshot
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to hit the timeshift stone in the key-locked room in Lanayru
    Mining Facility with the Beetle or Bow. on: You may need to precisely use the Slingshot to hit
    the timeshift stone in the key-locked room in Lanayru Mining Facility.
- name: Lanayru Mining Facility Whip Timeshift Stone
  command: logic-lmf-whip-armos-room-timeshift-stone
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to hit the timeshift stone in the Armos room of Lanayru Mining
    Facility with a Skyward Strike, Slingshot, or Bow. on: You may need to use the Whip to hit the
    timeshift stone in the Armos room of Lanayru Mining Facility
- name: Lanayru Mining Facility Ride on Minecart
  command: logic-lmf-minecart-jump
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to get to the vanilla boss key room by opening the Wind Gates and
    following the central minecart path. on: You may need to jump onto and ride the minecart
    in-front of the Lanayru Mining Facility boss door to get to the vanilla boss key room.
- name: Lanayru Mining Facility Moldarach without Gust Bellows
  command: logic-lmf-bellowsless-moldarach
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to defeat Moldarach in Lanayru Mining Facility with the Gust
    Bellows. on: You may need to defeat Moldarach in Lanayru Mining Facility without the Gust
    Bellows.
- name: Ancient Cistern Lever Jump
  command: logic-ac-lever-jump-trick
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to use the Whip to flip the lever that stops the waterfall in
    Ancient Cistern. on: You may need to jump down from above to flip the lever that stops the
    waterfall in Ancient Cistern.
- name: Ancient Cistern Chest after Whip Hooks Jump
  command: logic-ac-chest-after-whip-hooks-jump
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to get the Ancient Cistern - Chest after Whip Hooks by using the
    Whip. on: You may be expected to get the Ancient Cistern - Chest after Whip Hooks by jumping
    down from the higher platform after exiting the basement via the long thread.
- name: Sandship Jump to Stern
  command: logic-sandship-jump-to-stern
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to get the Sandship - Chest at Ship's Stern by using the
    Clawshots. on: You may need to get the Sandship - Chest at Ship's Stern by side-hopping from the
    top of the mast.
- name: Sandship Itemless Spume
  command: logic-sandship-itemless-spume
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to get past the Spume in the Sandship corridor by defeating it or
    stunning it with the Slingshot. on: You may need to get past the Spume in the Sandship corridor
    without any items.
- name: Sandship No Combination Hint
  command: logic-sandship-no-combination-hint
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to open the combination lock in the Sandship if you have the Gust
    Bellows to uncover the combination. on: You may need to open the combination lock in the
    Sandship without using the Gust Bellows to get the combination.
- name: Fire Sanctuary Pillar Jump
  command: logic-fs-pillar-jump
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to cross the broken bridge in Fire Sanctuary with the Clawshots.
    on: You may need to precisely jump around the pillars on the broken bridge in Fire Sanctuary.
- name: Fire Sanctuary Ghirahim 2 with Practice Sword
  command: logic-fs-practice-sword-ghirahim-2
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to defeat Ghirahim 2 with Goddess Sword or better. on: You may
    need to defeat Ghirahim 2 with Practice Sword.
- name: Present Bow Switch Shots
  command: logic-present-bow-switches
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to hit Bow switches in the past when they are not covered by
    barbed wire. on: You may need to hit Bow switches in the present when they are covered by barbed
    wire.
- name: Sky Keep Vine Clip
  command: logic-skykeep-vineclip
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will only be expected to use the Beetle and Clawshots to travel across the Fire
    Sanctuary room in Sky Keep. on: You may need to use the Bomb Bag and Clawshots to clip through
    the vines in the Fire Sanctuary room in Sky Keep.
- name: Random Starting Tablet Count
  command: random-starting-tablet-count
  type: int
  min: 0
  max: 3
  default: 1
  bits: 2
  help: >-
    0-3: Select the number of randomly chosen tablets you would like to start with. This is in
    addition to any tablets you have added to your starting inventory already.
- name: Random Starting Item Count
  command: random-starting-item-count
  type: int
  min: 0
  max: 7
  default: 0
  bits: 3
  help: >-
    0-7: Select the number of randomly chosen items you would like to start with. Only a selection
    of the most useful items are able to be chosen to maximize the benefit of this setting.
- name: Starting Hearts
  command: starting-hearts
  type: int
  min: 6
  max: 18
  default: 6
  bits: 5
  help: '6-18: Select the number of hearts you want to start with.'
- name: Start with All Bugs
  command: start-with-all-bugs
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will start the game without any bugs in your inventory. on: You will start the game
    with 99 of each bug in your inventory.
- name: Start with All Treasures
  command: start-with-all-treasures
  type: singlechoice
  choices:
    - 'off'
    - 'on'
  default: 'off'
  bits: 1
  help: >-
    off: You will start the game without any treasures in your inventory. on: You will start the
    game with 99 of each treasure in your inventory.
- name: Archipelago Item Model
  command: archipelago-item-model
  type: singlechoice
  choices:
    - letter
    - archipelago_logo
    - unofficial_archipelago_logo
  default: archipelago_logo
  bits: 2
  help: >-
    letter: Uses the vanilla Cawlin's Letter model for items from other Archipelago worlds.
    archipelago_logo: Uses a custom Archipelago logo model for items from other Archipelago worlds.
    unofficial_archipelago_logo: Uses a custom unofficial Archipelago logo model for items from
    other Archipelago worlds.
