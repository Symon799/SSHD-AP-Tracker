  bits: 4
  help: >-
    default: The daytime sky color will be unchanged. blue: The daytime sky color will be a pastel
    blue color. green: The daytime sky color will be a pastel green color. yellow: The daytime sky
    color will be a pastel yellow color. orange: The daytime sky color will be a pastel orange
    color. red: The daytime sky color will be a pastel red color. purple: The daytime sky color will
    be a pastel purple color. pink: The daytime sky color will be a pastel pink color. white: The
    daytime sky color will be a white color. black: The daytime sky color will be a black color.
    grey: The daytime sky color will be a grey color. rainbow: The daytime sky color will fade
    between different colors over time.
